name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix client

      - name: Lint
        run: npm run lint --prefix client

      - name: Build
        run: npm run build --prefix client
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://placeholder.example.com' }}
          REACT_APP_SOCKET_URL: ${{ secrets.REACT_APP_SOCKET_URL || 'https://placeholder.example.com' }}
          REACT_APP_REALTIME_MODE: polling
          CI: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: client/build/
          retention-days: 7
